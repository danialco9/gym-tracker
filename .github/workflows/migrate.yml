name: Migrate production database

# On Vercel the API has no start-up script, so the work docker-entrypoint.sh does when the Docker image
# starts happens here instead: bring the schema up to date and load the exercise catalog after each push to main.
on:
  push:
    branches: [main]
    paths:
      - backend/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate

jobs:
  migrate:
    name: Upgrade schema and seed catalog
    runs-on: ubuntu-latest
    # Set to true in the repository variables since the API moved to Vercel.
    if: ${{ vars.PRODUCTION_MIGRATIONS_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      GYM_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      # Required by the settings but unused: migrating issues no tokens.
      GYM_JWT_SECRET: migrating-does-not-sign-tokens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Upgrade schema
        run: uv run alembic upgrade head

      - name: Seed exercise catalog
        run: uv run gym-admin seed-catalog
